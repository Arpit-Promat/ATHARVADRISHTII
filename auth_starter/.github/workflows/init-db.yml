name: Initialize auth database
on:
  workflow_dispatch:
jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r auth_starter/requirements.txt
      - name: Create tables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cd auth_starter && python scripts/init_db.py
