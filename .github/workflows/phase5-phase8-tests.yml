name: Phase 5 and Phase 8 tests

on:
  push:
    branches:
      - feat/severity-realworld-evaluation
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip numpy pillow
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile changed Python modules
        run: python -m py_compile severity_engine.py evaluate_real_world.py pages/1_AI_Scanner.py
