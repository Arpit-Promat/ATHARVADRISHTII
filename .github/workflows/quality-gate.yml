name: Quality gate

on:
  push:
    branches: ["main", "fix/qa-reliability-batch"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip numpy pillow pytest

      - name: Compile application modules
        run: |
          python -m py_compile             streamlit_app.py             pages/1_AI_Scanner.py             prediction_engine.py             image_validation.py             model_registry.py

      - name: Run prediction and image-validation tests
        run: |
          python -m pytest -q             tests/test_prediction_engine.py             tests/test_image_validation.py
