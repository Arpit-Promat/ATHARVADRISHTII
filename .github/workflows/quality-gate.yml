name: Quality gate

on:
  push:
    branches: ["main", "fix/qa-reliability-batch"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip numpy pillow pytest

      - name: Compile application modules
        run: |
          python -m py_compile streamlit_app.py
          python -m py_compile pages/1_AI_Scanner.py
          python -m py_compile pages/2_Sign_Up.py
          python -m py_compile app_supabase_auth.py
          python -m py_compile prediction_engine.py
          python -m py_compile image_validation.py
          python -m py_compile model_registry.py

      - name: Run prediction and image-validation tests
        run: |
          python -m pytest -q tests/test_prediction_engine.py tests/test_image_validation.py
